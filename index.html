<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>6-Day PPL Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: gym day-card. Sticky day switcher, stat strip, then a grid of exercise cards in workout order, weekly volume chart at the end. */
:root{
  --bg:#EDF0F3; --card:#FFFFFF; --panel:#F5F7F9; --ink:#151A21; --muted:#596473; --line:#D3D9E0;
  --ghost:#C5CDD6; --far:#8E99A7; --eq:#DDE3EA; --eqs:#8C98A7; --eqp:#B4BEC9;
  --legs:#2F8A47; --core:#6E52C2; --pull:#2B5FC7; --push:#C9531A;
  --day:var(--pull);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --card:#161B22; --panel:#1B212A; --ink:#E7EBF0; --muted:#9AA5B2; --line:#29313B;
  --ghost:#38424E; --far:#6A7686; --eq:#252D37; --eqs:#6C7888; --eqp:#3A4552;
  --legs:#5FBE76; --core:#A48BF0; --pull:#6D9BF5; --push:#EF8A4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1216; --card:#161B22; --panel:#1B212A; --ink:#E7EBF0; --muted:#9AA5B2; --line:#29313B;
  --ghost:#38424E; --far:#6A7686; --eq:#252D37; --eqs:#6C7888; --eqp:#3A4552;
  --legs:#5FBE76; --core:#A48BF0; --pull:#6D9BF5; --push:#EF8A4C; color-scheme:dark}
:root[data-day="legs"]{--day:var(--legs)} :root[data-day="pull"]{--day:var(--pull)} :root[data-day="push"]{--day:var(--push)}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand span{color:var(--day)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{font:600 13px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tab:focus-visible,.setb:focus-visible,.btn:focus-visible{outline:2px solid var(--day);outline-offset:2px}

.dayhead{display:grid;gap:14px;padding-block:28px 18px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip-today{background:var(--day);color:var(--card);padding:4px 8px;border-radius:4px;letter-spacing:.08em}
h1.dt{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,76px);line-height:.9;margin:0;text-transform:uppercase;text-wrap:balance}
h1.dt em{font-style:normal;color:var(--day)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat b{display:block;font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{color:var(--muted);font-size:13px;max-width:65ch;margin:0}
.rowtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:500 13px/1 var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}

.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:36px}
@media (min-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.done{border-color:var(--day)}
.figs{background:var(--panel);display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--line);position:relative}
.figs.two{grid-template-columns:1fr 1fr}
.figs.two .fig + .fig{border-left:1px dashed var(--line)}
.fig{display:flex;flex-direction:column;align-items:center;padding:8px 6px 4px;min-width:0}
.fig svg{width:100%;max-width:260px;height:auto;display:block}
.fig .cap{font:600 11px/1.2 var(--f-mono);color:var(--muted);text-align:center;padding-bottom:4px}
.order{position:absolute;top:8px;left:10px;font:600 12px/1 var(--f-mono);color:var(--muted)}
.tagss{position:absolute;top:8px;right:10px;font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--day);color:var(--card);padding:4px 6px;border-radius:4px}
.body{padding:14px 16px 16px;display:grid;gap:10px}
.name{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.05;margin:0;text-wrap:balance}
.name small{display:block;font:500 12px/1.4 var(--f-body);color:var(--muted);margin-top:2px}
.rx{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rx b{font:600 28px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--day)}
.rx span{font-size:13px;color:var(--muted)}
.mus{display:flex;gap:6px;flex-wrap:wrap}
.mus span{font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.setb{font:600 12px/1 var(--f-mono);min-width:44px;height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.setb[aria-pressed="true"]{background:var(--day);border-color:var(--day);color:var(--card)}
.cues{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink);display:grid;gap:3px}
.cues li::marker{color:var(--day)}
.cuesh{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 0 -4px}

section.week{padding-block:8px 48px;display:grid;gap:14px}
section.week h2{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase;margin:0;line-height:1}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.strip div{border-radius:8px;padding:8px;color:#fff;font-size:12px;line-height:1.25;min-width:0}
.strip b{display:block;font:600 11px/1 var(--f-mono);opacity:.85;margin-bottom:3px}
@media (max-width:520px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}

svg .near{stroke:var(--ink);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .farl{stroke:var(--far);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .ghost{stroke:var(--ghost);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="brand">6-Day <span>PPL</span> Guide</p>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>

<main class="wrap">
  <section class="dayhead" id="dayhead"></section>
  <div class="grid" id="grid"></div>

  <section class="week">
    <h2>Week at a glance</h2>
    <div class="strip" id="strip"></div>
    <div class="chartbox">
      <svg id="vol" viewBox="0 0 640 320" role="img" aria-label="Working sets per muscle group per week"></svg>
    </div>
    <div class="legend">
      <span><i style="background:var(--legs)"></i>Legs</span>
      <span><i style="background:var(--core)"></i>Core</span>
      <span><i style="background:var(--pull)"></i>Pull</span>
      <span><i style="background:var(--push)"></i>Push</span>
    </div>
    <p class="note">Weekly working sets by main muscle worked. Supersets count each exercise's 4 rounds. Treadmill finishers (100 kcal × 6 = 600 kcal/week) are not included. The "Today" tag assumes Day 1 is Monday and Sunday is rest.</p>
  </section>
</main>

function fill(o){['el','wr','kn','an','ft'].forEach(k=>{if(!o[k+'2'])o[k+'2']=[o[k][0]-3,o[k][1]]});return o}
for(const k in EX){const e=EX[k];if(e.v==='f'){e.A0={...e.A};e.B0={...e.A,...e.B}}else{e.A0=fill({...e.A});e.B0=fill({...e.A,...e.B})}e.S=e.S||[];e.M=e.M||[]}

const SIDE_FAR=[['hp','kn2','an2','ft2'],['sh','el2','wr2']];
const SIDE_NEAR=[['hp','kn','an','ft'],['hp','sh','h'],['sh','el','wr']];
const FRONT=[['sL','sR'],['hL','hR'],['hM','sM','h'],['sL','eL','wL'],['sR','eR','wR'],['hL','kL','aL','tL'],['hR','kR','aR','tR']];
const r1=n=>Math.round(n*10)/10;
function lerp(A,B,t){const o={};for(const k in A){const a=A[k],b=B[k]||a;o[k]=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}return o}
function aug(e,J){if(e.v==='f'){J.sM=[(J.sL[0]+J.sR[0])/2,(J.sL[1]+J.sR[1])/2];J.hM=[(J.hL[0]+J.hR[0])/2,(J.hL[1]+J.hR[1])/2];J.tL=[J.aL[0]-6,J.aL[1]+2];J.tR=[J.aR[0]+6,J.aR[1]+2]}return J}
const dOf=(lines,J)=>lines.map(l=>'M'+l.map(k=>r1(J[k][0])+' '+r1(J[k][1])).join('L')).join('');
const UNDER=new Set(['cable','lm','thick']);
function prop(p,J){
 const g=r=>Array.isArray(r)?r:J[r];
 const [x,y]=p.j?g(p.j):[0,0];const X=r1(x),Y=r1(y);
 switch(p.k){
  case 'db':
   if(p.o==='v')return `<path d="M${X} ${r1(y-8)}V${r1(y+8)}" stroke="var(--day)" stroke-width="2.5"/><rect x="${r1(x-5)}" y="${r1(y-11)}" width="10" height="4" rx="1" fill="var(--day)"/><rect x="${r1(x-5)}" y="${r1(y+7)}" width="10" height="4" rx="1" fill="var(--day)"/>`;
   if(p.o==='d')return `<circle cx="${X}" cy="${Y}" r="5.5" fill="var(--day)"/><circle cx="${X}" cy="${Y}" r="2" fill="var(--panel)"/>`;
   return `<path d="M${r1(x-8)} ${Y}H${r1(x+8)}" stroke="var(--day)" stroke-width="2.5"/><rect x="${r1(x-11)}" y="${r1(y-5)}" width="4" height="10" rx="1" fill="var(--day)"/><rect x="${r1(x+7)}" y="${r1(y-5)}" width="4" height="10" rx="1" fill="var(--day)"/>`;
  case 'plate':return `<circle cx="${X}" cy="${Y}" r="${p.r}" fill="color-mix(in srgb, var(--day) 22%, transparent)" stroke="var(--day)" stroke-width="3"/><circle cx="${X}" cy="${Y}" r="2.5" fill="var(--day)"/>`;
  case 'bar':return `<path d="M${r1(x-p.w/2)} ${Y}H${r1(x+p.w/2)}" stroke="var(--day)" stroke-width="3.5" stroke-linecap="round"/>`;
  case 'grip':return `<circle cx="${X}" cy="${Y}" r="4" fill="var(--day)"/>`;
  case 'ball':return `<circle cx="${X}" cy="${Y}" r="7" fill="var(--day)"/>`;
  case 'pad':return `<circle cx="${X}" cy="${Y}" r="5.5" fill="var(--eqs)"/>`;
  case 'kpad':return `<rect x="${r1(x-10)}" y="${r1(y-13)}" width="20" height="6" rx="3" fill="var(--eqs)"/>`;
  case 'rope':return `<path d="M${X} ${Y}l-4 7M${X} ${Y}l4 7" stroke="var(--day)" stroke-width="2.5" stroke-linecap="round"/>`;
  case 'sled':return `<path d="M${r1(x-8)} ${r1(y-10)}L${r1(x+10)} ${r1(y+14)}" stroke="var(--eqs)" stroke-width="6" stroke-linecap="round"/>`;
  case 'cable':{const a=g(p.a);return `<path d="M${a[0]} ${a[1]}L${X} ${Y}" stroke="var(--eqs)" stroke-width="1.3"/>`}
  case 'thick':{const a=g(p.a),b=g(p.b);return `<path d="M${r1(a[0])} ${r1(a[1])}L${r1(b[0])} ${r1(b[1])}" stroke="var(--eqp)" stroke-width="10" stroke-linecap="round"/>`}
  case 'lm':{const a=p.p,dx=x-a[0],dy=y-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;const ex=x+ux*14,ey=y+uy*14;
   return `<path d="M${a[0]} ${a[1]}L${r1(ex)} ${r1(ey)}" stroke="var(--eqs)" stroke-width="3" stroke-linecap="round"/><circle cx="${r1(x+ux*12)}" cy="${r1(y+uy*12)}" r="9" fill="color-mix(in srgb, var(--day) 22%, transparent)" stroke="var(--day)" stroke-width="2.5"/>`}
 }return ''}
function stat(p){
 switch(p.k){
  case 'rect':return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="2" fill="var(--eq)" stroke="var(--eqs)" stroke-width="1"/>`;
  case 'circ':return `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="var(--eq)" stroke="var(--eqs)" stroke-width="1.2"/>`;
  case 'ln':{let d='M';for(let i=0;i<p.p.length;i+=2)d+=(i?'L':'')+p.p[i]+' '+p.p[i+1];return `<path d="${d}" stroke="${p.w>=6?'var(--eqp)':'var(--eqs)'}" stroke-width="${p.w||3}" fill="none" stroke-linecap="round"/>`}
  case 'arc':return `<path d="${p.d}" stroke="var(--day)" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/><path d="M112 82l6 6-8 2" stroke="var(--day)" stroke-width="1.6" fill="none"/>`;
 }return ''}
function poseSVG(e,t){
 const J=aug(e,lerp(e.A0,e.B0,t));
 let s='';
 if(e.v!=='f')s+=`<path class="farl" d="${dOf(SIDE_FAR,J)}"/>`;
 s+=e.M.filter(p=>UNDER.has(p.k)).map(p=>prop(p,J)).join('');
 s+=`<path class="near" d="${dOf(e.v==='f'?FRONT:SIDE_NEAR,J)}"/><circle cx="${r1(J.h[0])}" cy="${r1(J.h[1])}" r="8" fill="var(--ink)"/>`;
 s+=e.M.filter(p=>!UNDER.has(p.k)).map(p=>prop(p,J)).join('');
 return s}
function figSVG(key){
 const e=EX[key];const J=aug(e,{...e.A0});
 const ghost=`<path class="ghost" d="${dOf(e.v==='f'?FRONT:[...SIDE_FAR,...SIDE_NEAR],J)}"/><circle cx="${J.h[0]}" cy="${J.h[1]}" r="7" fill="none" stroke="var(--ghost)" stroke-width="2" stroke-dasharray="1 4"/>`;
 return `<svg viewBox="0 -14 200 174" role="img" aria-label="${e.n}: start and finish position"><g>${e.noFloor?'':'<path d="M0 150H200" stroke="var(--line)" stroke-width="2"/>'}${e.S.map(stat).join('')}</g><g>${ghost}</g><g data-ex="${key}">${poseSVG(e,1)}</g></svg>`}

/* ---------- animation ---------- */
let figs=[];
function drawAt(t){figs.forEach(f=>{f.g.innerHTML=poseSVG(f.e,t)})}
function phase(now){const p=(now%3200)/3200;let u;if(p<.15)u=0;else if(p<.5)u=(p-.15)/.35;else if(p<.65)u=1;else u=1-(p-.65)/.35;return .5-.5*Math.cos(Math.PI*u)}
let last=0;
function loop(now){if(!paused&&!RM.matches&&now-last>33){last=now;drawAt(phase(now))}requestAnimationFrame(loop)}

function week(){
 document.getElementById('strip').innerHTML=DAYS.map(d=>`<div style="background:var(--${d.type})"><b>DAY ${d.n}</b>${d.title}</div>`).join('');
 const vol={};Object.keys(GROUPCAT).forEach(g=>vol[g]=0);
 DAYS.forEach(d=>d.items.forEach(it=>{(it.ss||[it.ex]).forEach(x=>{const v=EX[x].vol;if(v&&it.s)vol[v]+=it.s})}));
 const rows=Object.entries(vol);const max=32,x0=118,W=480,rh=27,top=14;
 let s='';
 for(let t=0;t<=max;t+=8){const x=x0+W*t/max;s+=`<line x1="${x}" y1="${top-4}" x2="${x}" y2="${top+rows.length*rh}" stroke="var(--line)" stroke-width="1"/><text x="${x}" y="${top+rows.length*rh+18}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--muted)">${t}</text>`}
 rows.forEach(([g,v],i)=>{const y=top+i*rh;const w=W*v/max;
  s+=`<text x="${x0-10}" y="${y+17}" text-anchor="end" font-family="Public Sans, sans-serif" font-size="13" fill="var(--ink)">${g}</text><rect x="${x0}" y="${y+5}" width="${w}" height="16" rx="3" fill="var(--${GROUPCAT[g]})"/><text x="${x0+w+6}" y="${y+17}" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="var(--ink)">${v}</text>`});
 s+=`<text x="${x0+W/2}" y="${top+rows.length*rh+36}" text-anchor="middle" font-family="Public Sans, sans-serif" font-size="12" fill="var(--muted)">Working sets per week</text>`;
 const svg=document.getElementById('vol');svg.setAttribute('viewBox',`0 0 640 ${top+rows.length*rh+44}`);svg.innerHTML=s;
}
render();week();requestAnimationFrame(loop);
</script>
</body>
</html>
